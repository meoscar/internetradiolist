name: Look at internet-radio.com

# Reconnaissance, not a crawler. It fetches robots.txt, the home page, a few
# listing pages and one station page, and prints their structure so a parser can
# be written against what is there rather than what someone imagined.
#
# Manual only. Nothing in the repository is written or changed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read the site
        run: python3 probe_site.py
