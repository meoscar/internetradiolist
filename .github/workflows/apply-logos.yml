name: Point the catalogue at the logos

# Repoints music.json and music_worldradio.json at the logos taken from each
# station's own site, and clears the image on rows that have no logo and are
# currently aimed at the scraped folder. Default is a dry run.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Actually write the catalogue'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: What would change
        run: python3 apply_logos.py

      - name: Change it
        if: ${{ github.event.inputs.apply == 'true' }}
        run: python3 apply_logos.py --apply

      - name: Refuse to commit a broken catalogue
        if: ${{ github.event.inputs.apply == 'true' }}
        run: python3 validate_stations.py

      - name: Commit
        if: ${{ github.event.inputs.apply == 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music.json music_worldradio.json
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Station images from the stations, not from an image search"
          git pull --rebase origin main
          git push
