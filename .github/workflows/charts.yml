name: What radio played this week

# Once a day. The tally it reads is built by the quarter-hourly live pass, so
# there is nothing to collect here: this counts what is already there and looks
# up release years, which is the slow part and why it is not in the live pass.
on:
  schedule:
    # Daily. Release-year lookups run at the rate Apple publishes, about twenty
    # a minute, so three hundred of them take a quarter of an hour and there is
    # no reason to do that more often than the chart changes.
    - cron: '40 5 * * *'
  workflow_dispatch:
    inputs:
      lookups:
        description: How many release years to look up (0 = none)
        default: '300'

permissions:
  contents: write

concurrency:
  group: charts
  cancel-in-progress: false

jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Take the week's tally
        run: |
          git fetch origin live --depth 1
          git show origin/live:week.json > week.json
          echo "tally: $(wc -c < week.json) bytes"

      - name: Count it, and date what is not dated yet
        run: python3 charts.py --lookups "${{ github.event.inputs.lookups || 300 }}"

      - name: Publish the chart beside the live pass
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # years.json is the one thing here worth keeping for ever: every entry
          # is a request that never has to be made again. It goes on main.
          if ! git diff --quiet -- years.json; then
            git add years.json
            git commit -q -m "Release years learned $(date -u '+%Y-%m-%d')"
            git pull --rebase -q origin main && git push origin HEAD:main
          fi

          # The chart itself joins the live branch, which is rebuilt from
          # nothing each time so it never accumulates history.
          git fetch origin live --depth 1
          git checkout --orphan charts-build
          git rm -rf --cached . > /dev/null
          git show origin/live:live.json > live.json
          git show origin/live:week.json > week.json
          git add -f live.json week.json charts.json
          git commit -q -m "Charts at $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -f origin charts-build:live
          echo "https://raw.githubusercontent.com/meoscar/internetradiolist/live/charts.json"
