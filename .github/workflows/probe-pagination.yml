name: Look at pagination and the resets

# Two guesses about pagination and two about the connection resets have all
# been wrong. This prints the evidence instead. It writes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 probe_pagination.py
