name: Where the stations are

# Match the catalogue against Radio Browser, a community directory that carries
# a country code on every station. One request for their whole list, then it is
# all dictionary lookups: faster than asking per station and much kinder to a
# service run by volunteers.
#
# It runs when the catalogue is rebuilt, rather than on a clock. It reads
# music_worldradio.json and writes countries.json, so a time of its own would
# be a guess about how long the Wednesday build takes -- and GitHub's scheduler
# is late often enough that the guess would sometimes read last week's
# catalogue. workflow_run says the dependency instead of approximating it.
#
# Until this was added the workflow had no trigger but a manual one, so
# countries.json only moved when somebody remembered. Every station the weekly
# rebuild added stayed without a country until then, and the Country folders
# drifted away from the catalogue they are drawn from.
on:
  workflow_run:
    workflows: ["Build the catalogue the app downloads"]
    types: [completed]
  workflow_dispatch:
    inputs:
      apply:
        description: Write countries.json (otherwise just report)
        type: boolean
        default: false

env:
  # Running automatically is the whole point of the trigger above, so those
  # runs write. A manual run still has to ask, which keeps the report-only
  # mode that made this safe to try in the first place.
  APPLY: ${{ github.event_name == 'workflow_run' || inputs.apply }}

# Missing until now, which is why the fixed git-status check above still
# could not push: the default GITHUB_TOKEN this workflow never asked to
# widen is read-only, and the commit that check correctly decided to make
# was refused with a 403.
permissions:
  contents: write

jobs:
  countries:
    # A failed catalogue build has nothing new to match against, and matching
    # the old one again would spend a Radio Browser request to write the file
    # it already wrote.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ask Radio Browser
        run: |
          python3 find_countries.py ${{ env.APPLY == 'true' && '--apply' || '' }}

      - name: Publish
        if: ${{ env.APPLY == 'true' }}
        run: |
          # git diff sees nothing to compare a file against that has never
          # been committed, so on the very first run -- the one that matters
          # most -- this reported "nothing changed" and skipped the commit,
          # even though find_countries.py had just written 777 matches to it.
          # git status catches both a new untracked file and a changed
          # tracked one.
          if [ -z "$(git status --porcelain -- countries.json)" ]; then
            echo "nothing changed"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add countries.json
          git commit -q -m "Where the stations are, from Radio Browser"
          # Not a bare push: this branch has other jobs committing to it too
          # (charts.yml's years.json, the catalogue builds), and a push that
          # lands between this job's checkout and its push is an ordinary
          # race, not a failure -- rebase onto whatever arrived and go again.
          git pull --rebase -q origin main
          git push
