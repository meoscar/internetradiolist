name: Is the album art right

# Measurement, not a schedule. The Now Playing screen shows the station's own
# now-playing string as the title and an iTunes lookup as the cover; nothing
# checks that the two agree. This runs the real strings through the real API
# and reports how often they do.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: How many now-playing strings to try (0 = all)
        default: "0"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Take the last live pass
        run: |
          git fetch origin live --depth=1
          git show origin/live:live.json > live.json
          python3 -c "import json;print(len(json.load(open('live.json'))['playing']),'titles')"

      - name: Ask iTunes about each of them
        run: python3 probe_artwork.py --limit "${{ inputs.limit }}"
