name: What is on the radio right now

# Every quarter of an hour: ask the busiest stations what they are playing, and
# read six listing pages for live listener counts.
#
# The result does NOT go on main. Ninety-six commits a day is thirty-five
# thousand a year, and a repository people clone should not carry that. It is
# force-pushed to an orphan branch instead, which is rebuilt from nothing each
# time, so `live` is always exactly one commit deep however long this runs.
on:
  schedule:
    # Quarter-hourly. GitHub runs scheduled jobs late under load and sometimes
    # skips them, so this is "about every fifteen minutes" -- which is why
    # live.json carries the time it was built and the app shows how old it is
    # rather than claiming to be current.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      stations:
        description: 'How many stations to ask'
        default: '200'

permissions:
  contents: write

concurrency:
  # A late run must never overlap the next one: both would force-push and the
  # older answer could land second.
  group: live-now
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bring the last answer forward
        run: |
          # Rising is a comparison and the week's tally is cumulative, so
          # both have to come forward from the orphan branch they live on.
          if git fetch origin live --depth 1 2>/dev/null; then
            git show origin/live:live.json > live.json 2>/dev/null \
              && echo "previous pass: $(wc -c < live.json) bytes" \
              || echo "no previous pass; nothing will be marked rising"
            git show origin/live:week.json > week.json 2>/dev/null \
              && echo "week so far:   $(wc -c < week.json) bytes" \
              || echo "no tally yet; this pass starts it"
            # Not read here, only carried. The branch is rebuilt from nothing
            # every quarter of an hour, so anything this step does not bring
            # forward is deleted -- and the daily chart only writes itself once
            # a day, so it would survive fifteen minutes and then vanish.
            git show origin/live:charts.json > charts.json 2>/dev/null \
              && echo "chart:         $(wc -c < charts.json) bytes" \
              || echo "no chart yet"

          else
            echo "no live branch yet; this pass creates it"
          fi

      - name: Ask the stations and the site
        run: python3 live_now.py --stations "${{ github.event.inputs.stations || 200 }}"

      - name: Add this pass to the week's tally
        run: python3 accumulate.py

      - name: Publish it, one commit deep
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # An orphan branch built from nothing: no parent, so the branch never
          # accumulates history no matter how often this runs.
          git checkout --orphan live-build
          git rm -rf --cached . > /dev/null
          git add -f live.json week.json
          # Only if it is there: the first passes run before any chart exists.
          [ -s charts.json ] && git add -f charts.json
          git commit -q -m "Live at $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -f origin live-build:live
          echo "https://raw.githubusercontent.com/meoscar/internetradiolist/live/live.json"
          echo "https://raw.githubusercontent.com/meoscar/internetradiolist/live/week.json"
