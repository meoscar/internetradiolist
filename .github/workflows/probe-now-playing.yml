# How many stations can be made to name their track, and by which route:
# the inline ICY title, the station's own status document, or nothing. Run
# from here because the sandbox this repository is worked on from cannot
# reach the stations; the answer is committed under probes/ with its date.
name: Probe how stations name their track

on:
  workflow_dispatch:
  push:
    paths:
      - 'probe_now_playing.py'
      - '.github/workflows/probe-now-playing.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ask a sample of every station
        run: |
          mkdir -p probes
          { echo "Probed $(date -u '+%Y-%m-%d %H:%M UTC') from GitHub's network: 400 stations sampled from the whole catalogue"; echo;
            python3 probe_now_playing.py 400 all; } | tee probes/now_playing_routes.txt
          tail -40 probes/now_playing_routes.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the answer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probes/now_playing_routes.txt
          git commit -q -m "By which route stations name their track, measured" || exit 0
          git pull -q --rebase origin main
          git push -q origin HEAD:main
