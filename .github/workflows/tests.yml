name: Tests

# The rules that decide what is and is not a song, and what the live pass
# publishes, on the strings that were at the top of the chart before them.
# Seconds, on a public repository where the minutes are free.
on:
  push:
    paths: ['*.py', 'tests/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['*.py', 'tests/**']

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet coverage
      - run: python3 -m coverage run --source=. --omit='tests/*' -m unittest discover -s tests -v
      # The number, on every run: the scripts that publish what the app
      # reads, then everything, so the second is never quoted without the first.
      - name: Coverage
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "The pipeline that publishes what the app reads:" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -m coverage report --include='notasong.py,station_artists.py,accumulate.py,charts.py,live_now.py,build_catalogue.py,station_status.py,harvest_icy.py,crawl_directory.py' | tee -a "$GITHUB_STEP_SUMMARY"
          # The probe_*.py scripts are questions asked once of a live site,
          # answered in their own docstrings and run by no workflow; they are
          # kept as the record of how a decision was reached, not as code
          # that publishes anything. They are not held to a coverage figure.
          echo "Everything that runs on a schedule or by hand, probes left out:" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -m coverage report --omit='tests/*,probe_*.py' | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Everything, one-off probes included:" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -m coverage report | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
