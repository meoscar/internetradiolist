name: Crawl the station directory

# Rebuilds directory.json from internet-radio.com's own listing pages, which
# carry the stream URL, name, genres, listener count and bitrate a row at a
# time. Writes directory.json only -- the catalogue the app downloads is left
# alone until the result has been looked at.
on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: 'Request budget (politeness cap)'
        default: '60'
      max_genres:
        description: 'Genres to walk, 0 for all'
        default: '3'
      pages_per_genre:
        description: 'Listing pages per genre'
        default: '2'
  schedule:
    - cron: '10 5 * * 2'

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Walk the directory
        run: |
          python3 crawl_directory.py \
            --max-requests "${{ github.event.inputs.max_requests || 1200 }}" \
            --max-genres "${{ github.event.inputs.max_genres || 0 }}" \
            --pages-per-genre "${{ github.event.inputs.pages_per_genre || 4 }}"

      - name: Turn the playlists into streams
        run: python3 resolve_streams.py

      - name: Commit what came back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add directory.json
          git commit -m "The station directory as it stands ($(date -u +%Y-%m-%d))" || {
            echo "nothing changed"; exit 0;
          }
          git push
