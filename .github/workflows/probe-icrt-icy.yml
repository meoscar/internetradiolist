name: Listen to ICRT's own metadata

# ICRT is the last station whose song title comes from scraping a web page, and
# the app carries HtmlUnit -- a headless browser, about twenty megabytes -- for
# that one station. The harvest found icy-metaint on its stream, so the server
# does interleave metadata; the one StreamTitle it sampled was empty.
#
# One sample at one instant does not settle it. This stays connected for two
# minutes and prints every block. It writes nothing.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Stream URL to listen to'
        default: 'https://stream.rcs.revma.com/nkdfurztxp3vv'
      seconds:
        description: 'How long to listen'
        default: '120'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 probe_icrt_icy.py "${{ inputs.url }}" "${{ inputs.seconds }}"
