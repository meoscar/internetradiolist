name: Validate station lists

on:
  push:
    paths: ['**.json', '.github/workflows/validate.yml']
  pull_request:
    paths: ['**.json']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate JSON
        run: python3 validate_stations.py
