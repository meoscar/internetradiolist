        //Get 參數
        function request(strParame) {
            var args = new Object();
            var query = location.search.substring(1);

            var pairs = query.split("&"); // Break at ampersand 
            for (var i = 0; i < pairs.length; i++) {
                var pos = pairs[i].indexOf('=');
                if (pos == -1) continue;
                var argname = pairs[i].substring(0, pos);
                var value = pairs[i].substring(pos + 1);
                value = decodeURIComponent(value);
                args[argname] = value;
            }
            return args[strParame];
        }
        //URL 字串查詢參數
        function FindURL(strParame) {
            var args = new Object();
            var query = $('#btnSearch').attr('href');
            var pairs = query.split("&"); // Break at ampersand 
            for (var i = 0; i < pairs.length; i++) {
                var pos = pairs[i].indexOf('=');
                if (pos == -1) continue;
                var argname = pairs[i].substring(0, pos);
                var value = pairs[i].substring(pos + 1);
                value = decodeURIComponent(value);
                args[argname] = value;
            }
            return args[strParame];
        }
        //過濾Get參數
        function URLFilter(strParame) {
            var query = $('#btnSearch').attr('href');

            var tmpTakeArray = new Array();
            var pairs = query.split("&"); // Break at ampersand

            for (var i = 0; i < pairs.length; i++) {
                var pos = pairs[i].indexOf('KP=');
                if (pos == -1) tmpTakeArray.push(i);;
            }
            query = '';
            for (var i = 0; i < tmpTakeArray.length; i++) {
                query += (i != 0 ? '&' : '') + pairs[tmpTakeArray[i]];
            }
            $('#btnSearch').attr('href', query);
        }
        function Query() {
            var tmpKeyPoint = document.getElementById('txtQuery').value;
            if (FindURL('KP') != undefined) {
                URLFilter('KP');
            }
            $('#btnSearch').attr('href', $('#btnSearch').attr('href') + '&KP=' + encodeURI(tmpKeyPoint));
        }
        function Validated() {
            var tmpKeyPoint = document.getElementById('txtQuery').value;
            if (tmpKeyPoint == '')

        function isPassValidateCode() {
            var nowValidateNumber = jQuery.ajax({
                url: "../System/ValidateNoConfirm.ashx",
                type: "post",
                async: false,
                data: {},
                success: function (htmlVal) { }
            }).responseText;

            if (nowValidateNumber == "" || nowValidateNumber == null) { alert("驗證碼逾時，請重新整理"); return false; }
            var userInput = document.getElementById('txtValidateNo').value;
            var validateResult = ((nowValidateNumber == userInput) ? true : false);

        //表單用
        function RemoveFormClass(tmpName) {
            if ($("#" + tmpName).hasClass("has-success"))
                $("#" + tmpName).removeClass("has-success")
            if ($("#" + tmpName).hasClass("has-error"))
                $("#" + tmpName).removeClass("has-error")
            if ($("#" + tmpName).hasClass("has-feedback"))
                $("#" + tmpName).removeClass("has-feedback")
            $("#" + tmpName + " div span").remove();
        }
        function NonRequiredValidated(tmpName) {
            $("input[name=" + tmpName + "]").blur(function () {
                RemoveFormClass(tmpName);
                if ($("input[name=" + tmpName + "]")[0].checkValidity()) {
                    $("#" + tmpName + " .tips").text('');

                }
                else {
                    $("#" + tmpName).addClass("has-error has-feedback");
                    $("#" + tmpName + " div").append('<span class="glyphicon glyphicon-remove form-control-feedback"></span>')
                    $("#" + tmpName + " .tips").text('');
                    $("#" + tmpName + " .tips").text($("#" + tmpName).text() + ' 格式錯誤');

                }
            });
        }
        function FormInitial(tmpName, tmpType) {
            switch (tmpType) {
                case "textarea":
                    TextareaInitial(tmpName);
                    break;
                case "checkbox":
                    CheckboxInitial(tmpName);
                    break;
                case "dropdownlist":
                    SelectInitial(tmpName);
                    break;
                default:
                    InputInitial(tmpName);
                    break;

            }
        }
        function InputInitial(tmpName) {
            if ($("input[name=" + tmpName + "]").attr('type') != 'checkbox') {
                RemoveFormClass(tmpName);
                if ($("input[name=" + tmpName + "]").val() != '' && $("input[name=" + tmpName + "]")[0].checkValidity()) {

                    $("#" + tmpName).addClass("has-success has-feedback");
                    $("#" + tmpName + " div").append('<span class="glyphicon glyphicon-ok form-control-feedback"></span>')
                    $("#" + tmpName + " .tips").text('');
                }
                else {

                    $("#" + tmpName).addClass("has-error has-feedback");
                    $("#" + tmpName + " div").append('<span class="glyphicon glyphicon-remove form-control-feedback"></span>')
                    $("#" + tmpName + " .tips").text('');
                    $("#" + tmpName + " .tips").text($("#" + tmpName).text() + ' 不能為空 或 格式錯誤');
                }
            }
        }
        function SelectInitial(tmpName) {
            RemoveFormClass(tmpName);
            var $options;
            var $selects = $('select[name=' + tmpName + ']');
            for (var i = 0; i < $selects.length; i++) {
                $options = $("option:selected", $selects[i]);
                //                    alert("val" + i + "=" + $options.val());
                //                    alert("text" + i + "=" + $options.text());
            }

            if ($options.val() != $("select[name=" + tmpName + "] option:first").val()) {

                $("#" + tmpName).addClass("has-success has-feedback");
                $("#" + tmpName + " div").append('<span class="glyphicon glyphicon-ok form-control-feedback"></span>');
                $("#" + tmpName + " .tips").text('');
            }
            if ($options.val() == $("select[name=" + tmpName + "] option:first").val()) {

                $("#" + tmpName).addClass("has-error has-feedback");
                $("#" + tmpName + " div").append('<span class="glyphicon glyphicon-remove form-control-feedback"></span>');
                $("#" + tmpName + " .tips").text('');
                $("#" + tmpName + " .tips").text($("#" + tmpName + " label").text() + ' 為必填項目，請選擇!');
            }
        }
        function TextareaInitial(tmpName) {
            RemoveFormClass(tmpName);
            if ($("textarea[name=" + tmpName + "]").val() != '') {

                $("#" + tmpName).addClass("has-success has-feedback");
                $("#" + tmpName + " div").append('<span class="glyphicon glyphicon-ok form-control-feedback"></span>');
                $("#" + tmpName + " .tips").text('');
            }
            else {

                $("#" + tmpName).addClass("has-error has-feedback");
                $("#" + tmpName + " div").append('<span class="glyphicon glyphicon-remove form-control-feedback"></span>');
                $("#" + tmpName + " .tips").text('');
                $("#" + tmpName + " .tips").text($("#" + tmpName).text() + ' 不能為空 或 格式錯誤');
            }
        }
        function CheckboxInitial(tmpName) {
            RemoveFormClass(tmpName);
            if ($("input[type=checkbox][name=" + tmpName + "]:checked").length != 0) {

                $("#" + tmpName).addClass("has-success has-feedback");
                $("#" + tmpName + " div:first").append('<span class="glyphicon glyphicon-ok form-control-feedback"></span>');
            }
            else {

                $("#" + tmpName).addClass("has-error has-feedback");
                $("#" + tmpName + " div:first").append('<span class="glyphicon glyphicon-remove form-control-feedback"></span>');
            }
        }
        function FieldValidated(tmpName) {

            $("input[name=" + tmpName + "]").blur(function () {
                InputInitial(tmpName);
            });
            //
            $("select[name=" + tmpName + "]").change(function () {
                SelectInitial(tmpName);
            });
            //
            $("textarea[name=" + tmpName + "]").blur(function () {
                TextareaInitial(tmpName);
            });
            //
            $("input[type=checkbox][name=" + tmpName + "]").change(function () {
                CheckboxInitial(tmpName);
            });
        }
        function SubmitAjax() {
            if (!HTML5_InputTypeValidated()) return;

            if ($("#contactForm").children(".has-error").length > 0) { alert('尚未填寫完成!'); return; }
            var tmpFormkey = $("#Formkey").text();
            $.post("ajax/FormData.aspx?FK=" + tmpFormkey, $("#contactForm").serialize(), function (data) {
                $("#messagebox").html(data);
                $("#contactForm").hide();
            });
        }
        function HTML5_InputTypeValidated() {
            for (i = 0; i < document.getElementById("contactForm").length; i++) {
                if (!$("#contactForm :input")[i].checkValidity()) {
                    // var tmpInputName = $("#contactForm :input:eq(" + i + ")").attr('name');
                    //                    alert($("#" + tmpInputName).text() + ' 格式錯誤');
                    //                    $("#" + tmpInputName + " .tips").text($("#" + tmpInputName).text() + ' 格式錯誤');
                    return false;
                }
            }
            return true;
        }
